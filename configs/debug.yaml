subject_model: Qwen/Qwen2.5-3B-Instruct
judge_model: google/gemma-3-4b-it
multiturn_dataset: ScaleAI/mhj
echo_chamber_dataset: null
max_seq_len: 384
intercept_layers: [-4]
train_subsample: 1000
val_subsample: 200
test_subsample: 300
ood_subsample: 240
output_root: outputs
require_gpu: false
real_attack_corpus:
  enabled: true
  required: true
  dataset_id: mvrcii/safety-harmful
  split: train
  max_records: 1500
  min_chars: 12
external_datasets:
  enabled: true
  datasets:
    jailbreakbench:
      enabled: true
      required: false
      dataset_id: JailbreakBench/JBB-Behaviors
      configs: [behaviors, null]
      splits: [harmful, train]
      kind: harmful_behavior
      max_records: 200
    advbench:
      enabled: true
      required: false
      dataset_id: S3IC/advbench
      configs: [null]
      splits: [train]
      kind: harmful_behavior
      max_records: 520
    lakera_gandalf:
      enabled: true
      required: false
      dataset_id: Lakera/gandalf_ignore_instructions
      configs: [null]
      splits: [train, validation, test]
      kind: prompt_injection
      max_records: 1000
    deepset_prompt_injections:
      enabled: true
      required: false
      dataset_id: deepset/prompt-injections
      configs: [null]
      splits: [train, test]
      kind: prompt_injection_binary
      max_records: 662
external_sleeper:
  enabled: true
  required: false
  source_name: anthropic_sleeper_agents_external
  local_path: null
  hf_dataset_id: null
  hf_config: null
  split: train
  max_records: 200
strong_judge:
  enabled: false
  provider: export_only
  openai_model: null
  anthropic_model: null
  annotation_file: null
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  epochs: 2
  batch_size: 4
  lr: 3e-4
sae:
  expansion_factor: 8
  k_sparse: 64
  l1_coeff: 0.001
  bilinear_rank: 64
  bilinear_l2_coeff: 0.0001
  steps: 200
  batch_size: 32
  lr: 3e-4
trajectory_encoder:
  heads: 4
  layers: 2
  dropout: 0.1
fuser:
  hidden_dim: 32
  steps: 200
  batch_size: 32
  lr: 3e-4
attack_fingerprints:
  enabled: true
  per_family: 24
  template_holdout: true
  holdout_template_variant: 2
  expansion_factor: 4
  k_sparse: 32
  steps: 80
  batch_size: 16
  lexical_max_features: 1024
  lr: 3e-4
  l1_coeff: 0.001
  families: [direct_harmful, roleplay_persona, policy_override, obfuscation, refusal_suppression, ordinary_multiturn_drift, sleeper_sequence]
baselines:
  mlp_hidden_dim: 128
  mlp_steps: 100
  mlp_lr: 1e-3
eval:
  batch_size: 4
  judge_batch_size: 2
  max_new_tokens: 32
  thresholds: [inf, 0.90, 0.75, 0.60, 0.45, 0.30, 0.20, 0.10, 0.05]
  seeds: [42]
  human_eval_samples: 32
data:
  sleeper_per_family: 60
  sleeper_ood_per_family: 30
  wikitext_batches: 2
  audit_examples_per_family: 20
memory:
  auto_tune: true
